services:
  app: # <-- You can name this whatever you want, but you will have to change the /vm/ngix/conf.d/default.conf
    image: haroldcris/php8.2.4
    container_name: php
    restart: unless-stopped
    volumes:
      - ./vm/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - ./code:/var/www
    #build:
    #  context: ./vm/php
    #  dockerfile: Dockerfile


  webserver:  # <-- You can name this whatever you want
    image: nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - ${APP_PORT}:80
      - 443:443
    environment:
      - FQDN=${DOMAIN_NAME}
    depends_on:  
      - certbot
    volumes:
      - ./vm/nginx/conf.d:/etc/nginx/templates:ro
      - ./vm/certbot/etc:/etc/ssl:ro
      - ./code:/var/www
      


  adminer: # <-- You can name this whatever you want
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - ${ADMINER_PORT}:8080



  db: # <-- You can name this whatever you want, this will be the server name when accessing SQL from Adminer
    image: mariadb
    container_name: mariadb
    restart: unless-stopped
    environment:
      SERVICE_NAME: mariadb
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Manila
    volumes:
      - ./vm/mysql/my.cnf:/etc/mysql/my.cnf
      - ./db:/var/lib/mysql


  certbot:
    image: certbot/dns-cloudflare
    container_name: 'certbot'
    volumes:
      - ./vm/certbot/etc:/etc/letsencrypt
      - ./vm/certbot/var:/var/lib/letsencrypt 
      - ./cloudflare-api-key.ini:/etc/cloudflare-api-key.ini     
    command: >       
            certonly 
              --agree-tos
              --email "${CERTBOT_EMAIL}"
              --dns-cloudflare
              --dns-cloudflare-credentials "/etc/cloudflare-api-key.ini"
              --keep-until-expiring
              --expand              
              -d ${DOMAIN_NAME} 

    # command: > 
    #         certonly --manual
    #           --agree-tos 
    #           --email "${CERTBOT_EMAIL}"
    #           --preferred-challenges dns
    #           --keep-until-expiring
    #           --expand              
    #           -d ${DOMAIN_NAME}
